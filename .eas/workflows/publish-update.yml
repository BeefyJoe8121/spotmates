name: Publish update

# Every push to main publishes the app to the "preview" branch,
# which opens in Expo Go (SDK 58) from the project's Updates page on expo.dev.
on:
  push:
    branches: ['main']

jobs:
  publish:
    name: Publish to Expo Go
    type: update
    # EXPO_PUBLIC_* values (like the USDA key) come from expo.dev → Environment variables → preview
    environment: preview
    params:
      branch: preview
      message: ${{ github.commit_message || 'Spot Mates update' }}
